{# une ligne d'evenement : variable `v` #}
<tr>
<td><span class="score {{ score_classe(v.score) }}">{{ v.score }}</span></td>
<td><a href="/evenement/{{ v.id }}">{{ v.titre }}</a>
<div class="doux">{{ v.theme or 'sans thème' }} · {{ 'Lyon/AURA' if v.zone == 'regional' else 'national' }} · {{ v.tendance }} · {{ v.verification }} · {{ v.nb_sources }} source(s)</div></td>
</tr>
