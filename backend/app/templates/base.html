<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{ titre_page }} · VEILLE</title>
<style>
:root{--bg:#f5f7fa;--carte:#fff;--txt:#1b2430;--doux:#5b6878;--ligne:#dde3ea;--acc:#1f5fbf;--acc2:#e8f0fc;
--crit:#c62828;--tres:#e8590c;--imp:#b58100;--info:#2b7a4b;--faible:#7b8794}
@media (prefers-color-scheme:dark){:root{--bg:#10151c;--carte:#18202a;--txt:#e3e8ee;--doux:#93a1b2;--ligne:#2a3542;
--acc:#6ea4ff;--acc2:#1c2b40;--crit:#ff6b6b;--tres:#ff9a4d;--imp:#e0b43c;--info:#5fc48a;--faible:#8a97a6}}
*{box-sizing:border-box}
body{margin:0;font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt)}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
header{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:6px 10px;background:var(--carte);
border-bottom:1px solid var(--ligne);position:sticky;top:0;z-index:2}
header b{font-size:14px;letter-spacing:.5px}header nav{display:flex;gap:10px;flex-wrap:wrap}
header nav a{color:var(--doux)}header nav a.on{color:var(--acc);font-weight:600}
main{max-width:980px;margin:0 auto;padding:8px}
.carte{background:var(--carte);border:1px solid var(--ligne);border-radius:6px;padding:8px 10px;margin:0 0 8px}
h1{font-size:16px;margin:2px 0 6px}h2{font-size:13px;margin:0 0 4px;color:var(--doux);text-transform:uppercase;letter-spacing:.4px}
table{width:100%;border-collapse:collapse}td,th{padding:3px 4px;border-bottom:1px solid var(--ligne);vertical-align:top;text-align:left}
th{font-weight:600;color:var(--doux);font-size:12px}
.doux{color:var(--doux);font-size:12px}.ligne{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.score{display:inline-block;min-width:30px;text-align:center;font-weight:700;border-radius:4px;padding:0 4px;color:#fff;font-size:12px}
.crit{background:var(--crit)}.tres{background:var(--tres)}.imp{background:var(--imp)}.info{background:var(--info)}.faible{background:var(--faible)}
.tag{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:3px;padding:0 5px;font-size:11px}
.texte{line-height:1.5;font-size:14px;word-wrap:break-word}
.grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
form.filtres{display:flex;flex-wrap:wrap;gap:4px}form.filtres input,form.filtres select,button{font:inherit;padding:3px 6px;
border:1px solid var(--ligne);border-radius:4px;background:var(--carte);color:var(--txt)}
button{background:var(--acc);color:#fff;border:0;cursor:pointer}
.pied{text-align:center;color:var(--doux);font-size:11px;padding:8px}
</style>
</head>
<body>
<header>
<b>VEILLE</b>
<nav>
<a href="/" {% if request.url.path == '/' %}class="on"{% endif %}>Accueil</a>
<a href="/archives" {% if request.url.path.startswith('/archives') %}class="on"{% endif %}>Archives</a>
<a href="/recherche" {% if request.url.path.startswith('/recherche') %}class="on"{% endif %}>Recherche</a>
{% if protege %}<a href="/deconnexion">Déconnexion</a>{% endif %}
</nav>
</header>
<main>
{% block contenu %}{% endblock %}
</main>
<div class="pied">VEILLE {{ version }} · lecture seule · chaque information porte sa source</div>
</body>
</html>
