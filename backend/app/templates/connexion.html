{% extends "base.html" %}
{% block contenu %}
<div class="carte" style="max-width:340px;margin:30px auto">
<h1>Connexion</h1>
{% if erreur == 'faux' %}<p style="color:var(--crit)">Mot de passe incorrect.</p>{% endif %}
{% if erreur == 'bloque' %}<p style="color:var(--crit)">Trop d'essais. Réessayez dans 15 minutes.</p>{% endif %}
<form method="post" action="/connexion">
<input type="hidden" name="suite" value="{{ suite }}">
<input type="password" name="mot_de_passe" autocomplete="current-password" autofocus required style="width:100%;padding:6px;margin-bottom:6px">
<button style="width:100%;padding:6px">Entrer</button>
</form>
<p class="doux">Session mémorisée 30 jours sur cet appareil.</p>
</div>
{% endblock %}
